[pytest]
pythonpath = .
testpaths = tests
base_url = https://dummypay.vercel.app
addopts = -ra --html=reports/report.html --self-contained-html --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
markers =
    smoke: fast sanity checks, run on every pull request
    regression: full functional suite
    nightly: slow / data-changing tests, run on the nightly schedule
    positive: happy-path tests
    negative: invalid input / error-handling tests
